<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Desafio API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="login-card">

            <div class="logo">
                <span>API</span>
            </div>

            <h1>Bem-vindo!</h1>

            <p class="subtitle">
                Entre com suas credenciais para continuar.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" id="btnLogin">
                    Entrar
                </button>

            </form>

            <p id="mensagem"></p>

            <div id="resultado" class="resultado hidden">
                <h3>Autenticação concluída!</h3>
                <p>Seu access_token foi recebido pela API.</p>

                <label>Access Token:</label>
                <textarea id="token" readonly></textarea>

                <button type="button" id="copiarToken">
                    Copiar token
                </button>
            </div>

        </section>

        <footer>
            Desafio de Desenvolvimento de Sistemas
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
